name: CI - Build, Scan and Push Demo App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: demo-app
  REGISTRY: ghcr.io

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Ler versão do arquivo VERSION
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão detectada: $VERSION"

      - name: Validar manifests Kubernetes
        run: |
          echo "Validando arquivos em k8s/"
          python3 - <<'PY'
          import sys, glob
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml"])
              import yaml

          files = glob.glob("k8s/*.yaml") + glob.glob("k8s/*.yml")
          if not files:
              print("Nenhum manifest encontrado em k8s/")
              sys.exit(1)

          for f in files:
              print(f"Checando {f}...")
              with open(f, "r", encoding="utf-8") as fh:
                  docs = list(yaml.safe_load_all(fh))
              for i, doc in enumerate(docs, 1):
                  if not doc:
                      print(f"Documento vazio em {f} #{i}")
                      sys.exit(1)
                  for key in ("apiVersion", "kind"):
                      if key not in doc:
                          print(f"Faltando '{key}' em {f} (doc #{i})")
                          sys.exit(1)
                  print(f"  OK: {doc.get('kind')} / {doc.get('metadata', {}).get('name', 'sem-nome')}")
          print("Manifests válidos.")
          PY

      - name: Definir tag da imagem
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Tag da imagem: $IMAGE_TAG"

      - name: Build da imagem Docker
        run: |
          docker build -t "$IMAGE_TAG" .
          docker images | grep demo-app

      - name: Scan da imagem com Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_TAG"
          echo "Imagem publicada: $IMAGE_TAG"